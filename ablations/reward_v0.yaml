# Dense reward sweep.
#
# The base reward is the delta of raw projected population margin against the
# strongest enemy. This sweep tests how strongly to weight that potential, how
# much future production to project into population, and
# whether mixing terminal outcome back in helps or hurts.
#
# Run with: python scripts/ablate.py --matrix ablations/reward_v0.yaml

base: configs/ppo_base.yaml
name: reward_v0

cells:
  - { run.name: dense_base, reward.potential_weight: 1.0, reward.production_weight: 1.0 }
  - { run.name: pop_only, reward.potential_weight: 1.0, reward.production_weight: 0.0 }
  - { run.name: prod_half, reward.potential_weight: 1.0, reward.production_weight: 0.5 }
  - { run.name: prod_two, reward.potential_weight: 1.0, reward.production_weight: 2.0 }
  - { run.name: dense_half, reward.potential_weight: 0.5, reward.production_weight: 1.0 }
  - { run.name: dense_double, reward.potential_weight: 2.0, reward.production_weight: 1.0 }
  - { run.name: outcome_mix, reward.win_value: 0.25, reward.loss_value: -0.25, reward.draw_value: 0.0 }
