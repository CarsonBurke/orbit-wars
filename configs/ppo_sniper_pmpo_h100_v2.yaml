# PMPO vs sniper_v18, H100 throughput build (v2).
#
# IDENTICAL to ppo_sniper_pmpo_h100.yaml except the rollout is scaled up to use
# the hardware. v1 was badly under-utilized: at num_envs=256 the rollout ran
# ~4.8s with GPU ~3% and CPU only ~24/64 cores busy — i.e. neither processor
# saturated. The per-step orchestration overhead (Python<->Rust marshaling, obs
# encoding) dominated, starving a tiny per-step batch. Pushing num_envs up
# amortizes that fixed overhead across a much larger batch, which raises BOTH
# CPU and GPU utilization and yields more fresh samples per on-policy update
# (strictly good for PMPO's single-epoch update). 80 GB HBM is wide open
# (v1 used ~19 GB), so the larger rollout buffer fits comfortably.
#
# Model section is byte-identical to ppo_sniper_pmpo_h100.yaml -> checkpoints
# remain --load-compatible across v1/v2 and the self-play handoff.
#
# Train from scratch — pass no `--load`.

run:
  name: ppo_sniper_pmpo_h100_v2
  seed: 0
  device: cuda
  compile_mode: reduce-overhead
  log_root: runs
  ckpt_root: checkpoints
  total_updates: 1000

game:
  num_players: 2
  episode_steps: 500
  act_timeout: 1.0
  ship_speed: 6.0

model:
  dim: 128
  ff_dim: 256
  depth: 3
  n_heads: 4
  n_kv_heads: 1
  dropout: 0.0
  planet_rope_fraction: 0.5
  planet_rope_base: 100.0
  encoder_backend: destination_conditioned
  num_fleet_latents: 64
  fleet_tokenizer_depth: 1
  value_min: -12.3
  value_max: 12.3
  value_num_bins: 255
  value_sigma_to_bin_ratio: 0.75
  critic_mtp_horizon: 6
  value_symlog: false
  value_bucket: dreamer3

optim:
  muon_lr: 5.0e-3
  lr: 3.0e-4
  head_lr: 3.0e-4
  control_lr: 3.0e-4
  lr_warmup_steps: 200
  kl_lr_target: 0.025
  kl_lr_ema_half_life: 20.0
  kl_lr_min_scale: 0.1
  kl_lr_max_scale: 10.0
  weight_decay: 1.0e-4
  grad_clip: 1.0
  # 4x the rollout buffer (num_envs 256->1024), so 2x the minibatch keeps the
  # PPO update on large, GPU-efficient kernels without changing the number of
  # gradient steps too drastically.
  minibatch_size: 16384
  epochs_per_update: 1

ppo:
  gamma: 0.997
  gae_lambda: 0.95
  policy_objective: pmpo
  pmpo_pos_to_neg_weight: 0.5
  pmpo_kl_coef: 0.3
  pmpo_reverse_kl: true
  advantage_transform: none
  norm_advantage: false
  norm_advantage_scope: minibatch
  advantage_return_norm: none
  advantage_return_norm_scope: batch
  clip_coef: 0.2
  clip_coef_high: 0.28
  value_coef: 1.0
  target_entropy_coef: 0.0
  critic_return_norm: none
  critic_return_norm_clip: 10.0
  fraction_entropy_coef: 0.0
  pretrain_updates: 0
  pretrain_episodes: 32
  pretrain_lr: 1.0e-3
  pretrain_behavior: heuristic

rollout:
  num_envs: 1024
  num_workers: 0
  env_backend: rust
  compile_fleet_width: 0
  snapshot_compile_rows: 64
  strict_target_legality: true

opponents:
  mode: fixed
  fixed_opponents:
    - sniper_v18
  snapshot_device: train
  initial_rating: 1500.0
  k_factor: 32.0

reward:
  potential_weight: 1.0
  production_weight: 1.0
  win_value: 0.0
  loss_value: 0.0
  draw_value: 0.0
  margin_scale: 0.0
