# PMPO self-play, H100-tuned — phase-2 of the sniper->self-play curriculum.
#
# IDENTICAL to ppo_selfplay_pmpo.yaml except the rollout/batch sizes are scaled
# for the rented H100 (num_envs 128->256, minibatch 4096->8192) to match
# ppo_sniper_pmpo_h100.yaml. The `model:` section is byte-identical to
# ppo_sniper_pmpo_h100.yaml, so the phase-1 checkpoint (best.pt) is
# --load-compatible: launch phase 2 with `--load checkpoints/<phase1>/best.pt`.
#
# See ppo_selfplay_pmpo.yaml for the full PMPO / opponent-pool rationale.

run:
  name: ppo_selfplay_pmpo_h100
  seed: 0
  device: cuda
  compile_mode: reduce-overhead
  log_root: runs
  ckpt_root: checkpoints
  total_updates: 1000

game:
  num_players: 2
  train_num_players: [2, 4]  # self-training samples 2p vs 4p uniformly per wave
  episode_steps: 500
  act_timeout: 1.0
  ship_speed: 6.0

model:
  dim: 128
  ff_dim: 256
  depth: 3
  n_heads: 4
  n_kv_heads: 1
  dropout: 0.0
  planet_rope_fraction: 0.5
  planet_rope_base: 100.0
  encoder_backend: destination_conditioned
  num_fleet_latents: 64
  fleet_tokenizer_depth: 1
  value_min: -12.3
  value_max: 12.3
  value_num_bins: 255
  value_sigma_to_bin_ratio: 0.75
  critic_mtp_horizon: 6
  value_symlog: false
  value_bucket: dreamer3

optim:
  muon_lr: 5.0e-3
  lr: 3.0e-4
  head_lr: 3.0e-4
  control_lr: 3.0e-4
  lr_warmup_steps: 200
  kl_lr_target: 0.025
  kl_lr_ema_half_life: 20.0
  kl_lr_min_scale: 0.1
  kl_lr_max_scale: 10.0
  weight_decay: 1.0e-4
  grad_clip: 1.0
  minibatch_size: 8192
  epochs_per_update: 1

ppo:
  gamma: 0.997
  gae_lambda: 0.95
  policy_objective: pmpo
  pmpo_pos_to_neg_weight: 0.5
  pmpo_kl_coef: 0.3
  pmpo_reverse_kl: true
  advantage_transform: none
  norm_advantage: false
  norm_advantage_scope: minibatch
  advantage_return_norm: none
  advantage_return_norm_scope: batch
  clip_coef: 0.2
  clip_coef_high: 0.28
  value_coef: 1.0
  target_entropy_coef: 0.0
  critic_return_norm: none
  critic_return_norm_clip: 10.0
  fraction_entropy_coef: 0.0
  pretrain_updates: 0
  pretrain_episodes: 32
  pretrain_lr: 1.0e-3
  pretrain_behavior: heuristic

rollout:
  num_envs: 256
  num_workers: 0
  env_backend: rust
  compile_policy: true
  compile_fleet_width: 0
  snapshot_compile_rows: 128
  strict_target_legality: true

opponents:
  mode: no_builtins
  snapshot_device: train
  snapshot_every: 1
  current_learner_prob: 0.6
  active_pool_prob: 0.2
  historical_archive_prob: 0.2
  active_pool_size: 16
  active_sample_panel_size: 1
  historical_training_archive_size: 128
  historical_sample_panel_size: 2
  historical_agent_cache_size: 4
  min_games_before_active_eviction: 16
  initial_rating: 1500.0
  k_factor: 32.0

reward:
  potential_weight: 1.0
  production_weight: 1.0
  win_value: 0.0
  loss_value: 0.0
  draw_value: 0.0
  margin_scale: 0.0
