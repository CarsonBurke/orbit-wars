# PMPO vs. a fixed sniper opponent — dreamer4 Policy-Mirror objective.
#
# Same model / optim / reward / matchmaking as `ppo_sniper` (fixed `sniper_v18`,
# destination_conditioned source-major actor, raw-return HL-Gauss critic), but
# the ACTOR objective is `policy_objective: pmpo` instead of PPO's clipped ratio
# surrogate (cleanrl HalfCheetah `iterthink_v24_beta_d3bucket_mtp_pmpo_v1`):
#
#   - Sign-only update: `chosen_logp · tanh(|adv|)` on the RAW advantage, with
#     the positive- and negative-advantage means balanced by
#     `pmpo_pos_to_neg_weight=0.5`. The advantage MAGNITUDE is discarded (only
#     its sign and a bounded tanh weight survive), so reward/return/advantage
#     normalization is unnecessary AND disabled: advantage_transform=none,
#     norm_advantage=false, advantage_return_norm=none, critic_return_norm=none.
#   - Trust region: an ANALYTICAL per-planet REVERSE KL(old‖new) penalty with
#     coefficient `pmpo_kl_coef=0.3` — NOT a ratio clip. The per-planet action
#     factorizes as Categorical{no-launch, targets} × launch-gated Beta, so the
#     closed-form KL is KL_categorical + p_launch_old · KL_Beta.
#   - "No other kl measures": the KL-adaptive LR controller is held constant
#     under PMPO (the reverse-KL penalty is the sole trust region), and there is
#     no KL early stop. The kl_lr_* knobs below are inert here.
#
# Train from scratch — pass no `--load`.

run:
  name: ppo_sniper_pmpo
  seed: 0
  device: cuda
  compile_mode: reduce-overhead
  log_root: runs
  ckpt_root: checkpoints
  total_updates: 1000

game:
  num_players: 2
  episode_steps: 500
  act_timeout: 1.0
  ship_speed: 6.0

model:
  dim: 128
  ff_dim: 256
  depth: 3
  n_heads: 4
  n_kv_heads: 1
  dropout: 0.0
  # 2D RoPE over planet tokens on PHYSICAL board coords (0..100). Aligned to the
  # 100-unit board: base=100 sets the lowest-frequency wavelength ~= board
  # extent (vs the LLM default 10000 -> ~628 >> board), fraction=0.5 gives 4
  # freqs/axis (head_dim 32 -> axis_dim 8) -> ladder lambda={6.3,19.9,62.8,198.7}
  # spanning fine-local to monotonic board-scale. NOTE: the 99%-win checkpoint
  # was trained with base=10000/fraction=0.25 and is NOT --load-compatible with
  # these frequencies; this is a from-scratch architecture change.
  planet_rope_fraction: 0.5
  planet_rope_base: 100.0
  encoder_backend: destination_conditioned
  # LEARNED fleet->planet flex attention (PMPO default): the destination-conditioned
  # trunk learns inbound-fleet conditioning via flex_attention over the full fleet
  # set instead of the hand-crafted native-Rust inbound summary. Requires the fixed
  # `compile_fleet_width` bucket below (the destination BlockMask is built outside
  # the captured CUDA-graph region).
  destination_learned_fleet_attention: true
  num_fleet_latents: 64
  fleet_tokenizer_depth: 1
  # Raw projected_margin returns reach O(10^4-10^5) with reward normalization
  # OFF, so the symlog critic support covers ±200k raw: symexp(12.3) ≈ ±220k.
  value_min: -12.3
  value_max: 12.3
  value_num_bins: 255
  value_sigma_to_bin_ratio: 0.75
  critic_mtp_horizon: 6
  value_symlog: false
  value_bucket: dreamer3

optim:
  # Muon overshoots a real transformer at the NorMuon reference 0.02 (it drives
  # constant-angular-velocity trunk drift the reverse-KL penalty alone cannot
  # brake without the KL-LR controller, which PMPO disables). ../trading_bot_0
  # found 5e-3 (~4x below 0.02) stable; the Adam heads match the cleanrl PMPO
  # ref's single 3e-4 Adam LR.
  muon_lr: 5.0e-3
  lr: 3.0e-4
  head_lr: 3.0e-4
  control_lr: 3.0e-4
  lr_warmup_steps: 200
  # KL-adaptive LR is INERT under PMPO (held constant — the reverse-KL penalty is
  # the only trust region). Kept here only so a `policy_objective: ppo` override
  # of this config behaves like ppo_sniper.
  kl_lr_target: 0.025
  kl_lr_ema_half_life: 20.0
  kl_lr_min_scale: 0.1
  kl_lr_max_scale: 10.0
  weight_decay: 0.0
  grad_clip: 1.0
  minibatch_size: 4096
  # Single epoch per update. PMPO's sole trust region is the coef=0.3 reverse-KL
  # penalty — there is no ratio clip and (unlike the cleanrl ref) no target_kl
  # early-stop. With 4 epochs the per-update approx_kl blew to 2-4 (vs the ref's
  # 0.03 early-stop cap), flinging the actor into a no-op death-spiral limit
  # cycle that never won vs sniper_v18. One pass per rollout caps per-update
  # movement directly (dreamer4-style single update), keeping 0.3 viable without
  # re-adding an early-stop.
  epochs_per_update: 1

ppo:
  gamma: 0.997
  gae_lambda: 0.95
  # dreamer4 Policy-Mirror actor objective with an analytical per-planet reverse
  # KL trust region. All advantage/return normalization is OFF (sign + tanh are
  # the only shaping) — see the header for the rationale.
  policy_objective: pmpo
  pmpo_pos_to_neg_weight: 0.5
  # dreamer4 / cleanrl PMPO default. PMPO is sign-only & magnitude-agnostic by
  # design: `tanh(|adv|)` is EXPECTED to saturate to ~1, so every action is
  # reinforced by the sign of its advantage at ~unit weight and the reverse-KL
  # penalty is the trust region. dreamer4 sums the KL over action components
  # (continuous_kl.sum(-1) + the MultiCategorical reduction) before averaging
  # over samples — our per-turn-sum aggregation matches that. The reverse-KL
  # penalty is the primary trust region; `pmpo_target_kl` below is a hard
  # actor-freeze backstop (no KL-LR controller).
  pmpo_kl_coef: 0.3
  pmpo_reverse_kl: true
  # Actor-freeze backstop on the analytical per-minibatch reverse KL(old‖new):
  # once a minibatch's mean per-source-planet KL exceeds this, the actor stops
  # updating for the rest of the epoch (the critic keeps training). Guards the
  # from-scratch-vs-strong-oracle-sniper regime against the large policy jumps
  # that drove the observed training oscillation.
  pmpo_target_kl: 0.03
  advantage_transform: none
  norm_advantage: false
  norm_advantage_scope: minibatch
  advantage_return_norm: none
  advantage_return_norm_scope: batch
  clip_coef: 0.2
  clip_coef_high: 0.28
  value_coef: 1.0
  target_entropy_coef: 0.0
  critic_return_norm: none
  critic_return_norm_clip: 10.0
  fraction_entropy_coef: 0.0
  pretrain_updates: 0
  pretrain_episodes: 32
  pretrain_lr: 1.0e-3
  pretrain_behavior: heuristic

rollout:
  num_envs: 128
  num_workers: 0
  env_backend: rust
  compile_fleet_width: 64  # fixed fleet bucket required by destination_learned_fleet_attention
  snapshot_compile_rows: 64
  strict_target_legality: true

opponents:
  mode: fixed
  fixed_opponents:
    - sniper_v18
  snapshot_device: train
  initial_rating: 1500.0
  k_factor: 32.0

reward:
  potential_weight: 1.0
  production_weight: 1.0
  win_value: 0.0
  loss_value: 0.0
  draw_value: 0.0
  margin_scale: 0.0
