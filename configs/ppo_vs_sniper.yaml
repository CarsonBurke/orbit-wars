# PPO fixed-opponent config: train against the static `sniper` bot.
#
# 2-player PPO config.
#
# LEARNING-REGRESSION FIX (validated 2026-06-19). Training had stopped learning:
# margin worsened and approx_kl exploded to 1000+. Root cause was the interaction
# between `rankgauss` advantage shaping and a well-fit distributional critic over
# a (near-)policy-invariant potential reward:
#   - The dense reward is the per-step delta of the projected-margin POTENTIAL.
#     It is only approximately policy-invariant (it uses an undiscounted phi'-phi
#     while GAE discounts at gamma=0.997, so a small (1-gamma) residual remains as
#     the genuine learnable signal), but a well-fit critic still cancels most of
#     it, leaving a near-zero advantage that is mostly NOISE.
#   - `rankgauss` maps advantages to unit-Gaussian quantiles BY RANK ONLY,
#     discarding magnitude, so it rescales that noise residual to a full-confidence
#     gradient. It also makes the per-update step size independent of LR, which
#     left the KL-adaptive LR controller powerless. -> KL blowup, divergence.
#
# Fix: disable rankgauss and rely on plain minibatch advantage NORMALIZATION
# (CleanRL base PPO). Whitening is NOT magnitude-immune in absolute terms, but it
# preserves RELATIVE magnitudes within the batch, so a coherent signal accumulates
# across minibatches/epochs while zero-mean noise cancels; and crucially it
# restores the LR->step-size coupling, so the per-planet-KL LR controller (target
# 0.02) can actually contain the trust region. Paired with a well-calibrated
# symlog HL-Gauss critic (cleanrl dg_beta_v6 style) and epochs_per_update=2 (see
# optim). Validated vs `sniper` over 400 updates: win_rate 0.016 -> ~0.89 (stable),
# margin -5011 -> +5500 (stable), full-row approx_kl bounded ~0.08, EV ~0.86.
#
# NOTE on opponent: this learns against the beatable `sniper` (the untrained
# policy already wins ~1.6% -> a bootstrap toehold). Against `sniper_v17` the
# untrained policy wins 0.000, so it cannot bootstrap (no toehold -> stationary
# returns -> critic over-fits to EV~0.997 -> no signal); reaching sniper_v17 needs
# a curriculum (warm-start vs sniper first), not just this config.

run:
  name: ppo_vs_sniper
  seed: 0
  device: cuda
  compile_mode: reduce-overhead
  log_root: runs
  ckpt_root: checkpoints
  total_updates: 1000

game:
  num_players: 2
  episode_steps: 500
  act_timeout: 1.0
  ship_speed: 6.0

model:
  dim: 128         # head_dim = dim / n_heads = 32 — Flash Attention 2 only
                   # accepts head_dim ∈ {16, 32, 64, 128, 256}, so 32 is the
                   # cheapest setting that lets SDPA dispatch to the FA2 kernel
                   # under bf16 autocast. dim=96 (head_dim=24) silently fell
                   # back to the math/mem-efficient kernel.
  ff_dim: 256      # 2·dim — sufficient for the trunk's small token count
                   # (≤17 planets + meta), and halves PPO-update activation
                   # footprint vs the canonical 4·dim.
  depth: 3
  n_heads: 4
  n_kv_heads: 1
  dropout: 0.0
  planet_rope_fraction: 0.25   # partial 2D RoPE over 8/32 dims per head, planets only
  planet_rope_base: 10000.0
  encoder_backend: destination_conditioned
  num_fleet_latents: 64
  fleet_tokenizer_depth: 1
  # cleanrl dg_beta_v6 HL-Gauss critic style: symlog distributional head, 101
  # bins, sigma 0.75 of a bin width. dreamer3 bucket symlogs internally, so
  # value_symlog MUST be false. Paired with critic_return_norm below, which
  # normalizes returns to ~unit so they sit inside the support; the support is
  # intentionally generous (±8 symlog-coord) rather than tightly matched — the
  # resulting coarse resolution keeps the critic honestly under-resolved (EV
  # settles ~0.86, not ~0.997), which preserves a usable advantage residual.
  # A tighter support (±3-±4) is a sharper-critic ablation worth trying ONLY
  # alongside a real terminal reward (see reward block).
  value_min: -8.0
  value_max: 8.0
  value_num_bins: 101
  value_sigma_to_bin_ratio: 0.75
  critic_mtp_horizon: 6
  value_symlog: false
  value_bucket: dreamer3
  action_logit_softcap: 8.0

optim:
  # Muon (transformer block matrix params). Matches parameter-golf
  # `matrix_lr=0.022`.
  muon_lr: 0.022
  # AdamW (input projections, task heads, biases, tokens).
  lr: 3.0e-4
  head_lr: 3.0e-4
  # No weight decay: PPO is non-stationary (each update sees a new behavior
  # distribution), so AdamW WD would bias the policy toward stale pre-update
  # weights in a way the importance ratio doesn't account for.
  weight_decay: 0.0
  grad_clip: 0.5   # actor and critic flows are clipped separately, including
                   # each flow's task head plus shared-trunk components.
  # KL-adaptive LR controller on per-planet KL (the per-source-planet factorized
  # action's natural unit; full-row KL would couple the trust region to how many
  # planets a player owns). EFFECTIVE only with rankgauss disabled, since then
  # the per-update step scales with LR. Target 0.02 keeps the trust region tight.
  # With epochs_per_update=2 the natural per-planet KL runs well below target
  # (~0.005), so the controller lifts the LR scale toward max — the trust region
  # is comfortable and full-row KL stays ~0.08.
  kl_lr_target: 0.02
  kl_lr_ema_half_life: 20.0
  kl_lr_min_scale: 0.1
  kl_lr_max_scale: 10.0
  # Fixed minibatch SIZE (no minibatch_count) so every optimizer step has the
  # same leading dim across updates — under `reduce-overhead` a variable shape
  # records a fresh CUDA-graph pool that never frees, leaking VRAM.
  minibatch_size: 1024
  # 2, not 4. At 4 epochs the actor over-steps within an update: the joint
  # (full-row) approx_kl spiked to 10-12 late in training and eroded a peak
  # win-rate of 0.55 back down to ~0.37. Halving epochs bounds within-update
  # drift -> full-row KL max drops to ~0.08, per-planet KL to ~0.005, and
  # win-rate climbs monotonically to ~0.89 and HOLDS over 400 updates (margin
  # -5011 -> +5500). This mirrors the cleanrl recipe's single-actor-epoch trust
  # region. (A proper actor/critic epoch split — few actor, more critic — is the
  # next refinement if more critic refit is ever needed.)
  epochs_per_update: 2

ppo:
  gamma: 0.997
  gae_lambda: 0.95
  # Disable rankgauss; keep CleanRL-base minibatch advantage normalization.
  # rankgauss rescales a vanishing-potential noise residual to a full-confidence
  # gradient AND decouples the step from LR (defeating the KL controller); plain
  # whitening preserves relative magnitude so coherent signal survives and noise
  # averages out, and keeps LR load-bearing.
  advantage_transform: none
  norm_advantage: true
  clip_coef: 0.2
  clip_coef_high: 0.28
  value_coef: 1.0               # distributional CE has bounded gradients; the
                                # actor/critic flows are clipped separately so the
                                # critic CE can run at full weight.
  target_entropy_coef: 0.0      # no explicit entropy bonus; exploration comes from stochastic sampling
  # Normalize returns to ~unit (orbit-wars analog of cleanrl's env reward
  # normalization) so they land inside the symlog value support and the critic
  # calibrates well.
  critic_return_norm: discounted_return_rms
  fraction_entropy_coef: 0.0
  pretrain_updates: 0   # cold-start pain is brief; pretraining wasn't paying for
                        # its wallclock.
  pretrain_episodes: 32
  pretrain_lr: 1.0e-3
  pretrain_behavior: heuristic

rollout:
  num_envs: 128             # parallel envs
  games_per_env_per_update: 1  # 128 full games per PPO update
  num_workers: 0            # only used by numpy_mp
  env_backend: rust
  compile_fleet_width: 0
  snapshot_compile_rows: 64
  strict_target_legality: true

opponents:
  mode: fixed
  fixed_opponents: [sniper]
  snapshot_device: train
  snapshot_every: 1   # ignored in fixed mode
  top_k: 10           # ignored in fixed mode
  self_play_prob: 0.8
  initial_rating: 1500.0
  k_factor: 32.0

reward:
  # Pure potential shaping (validated). The dense projected-margin potential is
  # the only reward; with the fix above it learns well vs sniper. A real terminal
  # anchor (win_value/loss_value, optional margin_scale) is the recommended
  # de-risking for LONG (1000-update) runs and a sharper critic — it is the one
  # term a well-fit critic cannot cancel — but it is inert when win-rate is ~0
  # (e.g. cold-starting vs sniper_v17), so it must be paired with a beatable
  # opponent or curriculum.
  signal: projected_margin
  potential_weight: 1.0
  production_weight: 1.0
  win_value: 0.0
  loss_value: 0.0
  draw_value: 0.0
  margin_scale: 0.0
