# Mixed 2-player / 4-player FFA self-training config.
#
# Differences from `ppo_base.yaml`:
#   - train_num_players: [2, 4]
#   - longer training (4-player games have longer credit-assignment chains)
#   - larger snapshot pool (FFA strategy collapse is steeper, so a deeper
#     league of past selves helps)
#   - higher target entropy to keep diverse FFA strategies alive.

run:
  name: ppo_4p
  seed: 0
  device: cuda
  compile_mode: reduce-overhead
  total_updates: 300

game:
  num_players: 4
  train_num_players: [2, 4]  # self-training samples 2p vs 4p uniformly per rollout wave
  episode_steps: 500
  ship_speed: 6.0

model:
  dim: 128
  ff_dim: 384
  depth: 4
  n_heads: 4
  n_kv_heads: 1
  dropout: 0.0
  planet_rope_fraction: 0.25
  planet_rope_base: 10000.0
  encoder_backend: destination_conditioned
  num_fleet_latents: 64
  fleet_tokenizer_depth: 1
  value_min: -100000.0
  value_max: 100000.0
  value_num_bins: 153
  value_sigma_to_bin_ratio: 2.0
  critic_mtp_horizon: 6
  value_symlog: true

optim:
  lr: 2.0e-4
  head_lr: 2.0e-4
  kl_lr_target: 0.025
  kl_lr_ema_half_life: 20.0
  kl_lr_min_scale: 0.1
  kl_lr_max_scale: 10.0
  weight_decay: 1.0e-4
  grad_clip: 1.0
  minibatch_size: 4096
  epochs_per_update: 4

ppo:
  gamma: 0.997
  gae_lambda: 0.95
  advantage_transform: rankgauss
  norm_advantage: true
  clip_coef: 0.2
  clip_coef_high: 0.28
  value_coef: 1.0
  target_entropy_coef: 0.015
  fraction_entropy_coef: 0.0
  pretrain_updates: 0
  pretrain_episodes: 32
  pretrain_lr: 1.0e-3
  pretrain_behavior: heuristic

rollout:
  num_envs: 128
  num_workers: 0
  env_backend: rust

opponents:
  mode: no_builtins
  snapshot_device: train
  snapshot_every: 1
  current_learner_prob: 0.4
  active_pool_prob: 0.3
  historical_archive_prob: 0.3
  active_pool_size: 16
  historical_training_archive_size: 128
  historical_sample_panel_size: 8
  historical_agent_cache_size: 8
  min_games_before_active_eviction: 16
  initial_rating: 1500.0
  k_factor: 32.0

reward:
  potential_weight: 1.0
  production_weight: 1.0
  win_value: 0.0
  loss_value: 0.0
  draw_value: 0.0
  margin_scale: 0.0
