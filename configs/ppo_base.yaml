# Main PPO config — the "primary" learned model.
#
# 2-player by default. Switch `game.num_players` to 4 for the FFA variant —
# the model architecture is the same; only the opponent pool composition
# and reward shaping should be tuned per-mode.
#
# VAPO defaults baked in:
#   - γ = 1.0 (finite-horizon, terminal-only reward — no discounting)
#   - λ_critic = 1.0 (Monte-Carlo target, unbiased)
#   - λ_policy = 0.95 (variance-reduced advantage)
#   - 50 critic-only pretraining updates against the heuristic baseline
#     before PPO turns on (cold-starts the value head).
#   - Token-level policy loss (sum-then-divide-by-step-count) — built
#     into ppo.py, not a flag.

run:
  name: ppo_base
  seed: 0
  device: cuda
  log_root: runs
  ckpt_root: checkpoints
  total_updates: 200

game:
  num_players: 2
  episode_steps: 500
  act_timeout: 1.0
  ship_speed: 6.0

model:
  dim: 128         # head_dim = dim / n_heads = 32 — Flash Attention 2 only
                   # accepts head_dim ∈ {16, 32, 64, 128, 256}, so 32 is the
                   # cheapest setting that lets SDPA dispatch to the FA2 kernel
                   # under bf16 autocast. dim=96 (head_dim=24) silently fell
                   # back to the math/mem-efficient kernel.
  ff_dim: 512      # standard 4·dim ratio
  depth: 3
  n_heads: 4
  dropout: 0.0

optim:
  # Muon (matrix params). Matches parameter-golf `matrix_lr=0.022`.
  # `muon_weight_decay` left at 0 — pg uses heavy WD because LM training is
  # stationary; PPO is non-stationary (each update sees a new behavior
  # distribution) and WD would bias the policy toward pre-update weights
  # in a way the importance ratio doesn't account for.
  muon_lr: 0.02
  # AdamW (everything else).
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 0.3   # parameter-golf default; tighter than the canonical 0.5.
                   # The single most impactful per-step lever for keeping
                   # PPO ratios close to 1: it caps gradient magnitude
                   # *before* Muon/AdamW transform it into a parameter step.
  minibatch_size: 1024
  epochs_per_update: 4

ppo:
  gamma: 1.0
  lambda_critic: 1.0
  lambda_policy: 0.95
  lambda_policy_alpha: 0.0
  clip_eps_low: 0.2    # tight lower bound — limits catastrophic policy
                       # jumps when advantage is negative.
  clip_eps_high: 0.28  # wider upper bound (VAPO §4.4 / DAPO default) — lets
                       # the policy lean into beneficial moves more freely.
                       # Set equal to clip_eps_low to recover vanilla PPO.
  value_coef: 0.5
  entropy_coef: 0.01
  pretrain_updates: 0   # PMA critic token gives the value head a dedicated
                        # representation, and pretraining against `heuristic`
                        # warms V on a state distribution PPO immediately
                        # leaves. Cold-start pain is brief; the wallclock cost
                        # of pretraining wasn't paying for itself.
  pretrain_episodes: 32
  pretrain_lr: 1.0e-3
  pretrain_behavior: heuristic

rollout:
  num_envs: 16              # parallel envs (= episodes per update)
  max_moves_per_turn: 16

opponents:
  snapshot_every: 1   # one snapshot per PPO update — weights only move once
                      # per update, so this is the finest meaningful cadence.
                      # UCB-based eviction in `OpponentPool._trim_to_top_k`
                      # handles prioritization toward strong+well-measured
                      # snapshots and culls the rest.
  top_k: 24           # ~24 updates of historical diversity before eviction
                      # kicks in — wide enough to dodge near-Nash collapse
                      # against very recent self.
  self_play_prob: 0.8
  initial_rating: 1500.0
  k_factor: 32.0

reward:
  win_value: 1.0
  loss_value: -1.0
  draw_value: 0.0
  capture_bonus: 0.0
  loss_penalty: 0.0
  sun_loss_penalty: 0.0
  margin_scale: 0.0
