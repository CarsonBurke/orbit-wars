# Heuristic baseline — no learning. Plays the production-weighted
# scorer-and-aim agent, head-to-head, to record reference win-rates.
#
# Train this once to populate the leaderboard of "what does free strategy
# get you?" — the learned policy must clearly beat these numbers to be
# worth submitting over the heuristic itself.

run:
  name: baseline_heuristic
  seed: 0
  device: cuda
  compile_mode: reduce-overhead
  total_updates: 0   # no learning; just calls evaluate.py downstream

game:
  num_players: 2
  episode_steps: 500
  ship_speed: 6.0

model:
  dim: 96
  ff_dim: 256
  depth: 3
  n_heads: 4
  dropout: 0.0
  planet_rope_fraction: 0.25
  planet_rope_base: 10000.0
  encoder_backend: fleet_latent
  num_fleet_latents: 64
  fleet_tokenizer_depth: 1

optim:
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 0.5
  minibatch_size: 4096
  epochs_per_update: 4

ppo:
  gamma: 0.997
  gae_lambda: 0.95
  norm_advantage: true
  spo_eps_low: 0.2
  spo_eps_high: 0.28
  value_coef: 1.0
  target_entropy_coef: 0.01
  fraction_entropy_coef: 0.0
  pretrain_updates: 0

rollout:
  num_envs: 128
  num_workers: 0
  env_backend: rust

opponents:
  snapshot_every: 50
  top_k: 4
  self_play_prob: 1.0   # baseline run: never sample frozen snapshots (none exist)
  initial_rating: 1500.0
  k_factor: 32.0

reward:
  potential_weight: 1.0
  production_weight: 1.0
  win_value: 0.0
  loss_value: 0.0
  draw_value: 0.0
