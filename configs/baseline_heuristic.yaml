# Heuristic baseline — no learning. Plays the production-weighted
# scorer-and-aim agent, head-to-head, to record reference win-rates.
#
# Train this once to populate the leaderboard of "what does free strategy
# get you?" — the learned policy must clearly beat these numbers to be
# worth submitting over the heuristic itself.

run:
  name: baseline_heuristic
  seed: 0
  device: cpu
  total_updates: 0   # no learning; just calls evaluate.py downstream

game:
  num_players: 2
  episode_steps: 500
  ship_speed: 6.0

model:
  dim: 96
  ff_dim: 256
  depth: 3
  n_heads: 4
  dropout: 0.0
  fraction_concentration: 4.0

optim:
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 0.5
  minibatch_size: 1024
  epochs_per_update: 4

ppo:
  gamma: 1.0
  lambda_critic: 1.0
  lambda_policy: 0.95
  lambda_policy_alpha: 0.0
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  pretrain_updates: 0

rollout:
  episodes_per_update: 4
  parallel_workers: 1
  max_moves_per_turn: 16

opponents:
  snapshot_every: 50
  top_k: 4
  self_play_prob: 1.0   # baseline run: never sample frozen snapshots (none exist)
  initial_rating: 1500.0
  k_factor: 32.0

reward:
  win_value: 1.0
  loss_value: -1.0
  draw_value: 0.0
